# 构建并推送镜像：推到 main 打 edge；打 v* 标签打版本号，正式版（标签里没有 -）另打 1.2 与 latest。
# 先跑 ci.yml 的全部检查，通过了才构建；打标签的，镜像推完再发 GitHub Release（正文取 CHANGELOG.md 的这一节）。
# 总是推 ghcr.io/<仓库所有者>/mx-clarity；仓库配了 DOCKERHUB_USERNAME、DOCKERHUB_TOKEN 两个 secret 时同时推 Docker Hub。
# action 固定到提交 SHA（行尾是版本号）：这个任务带着推送权限与 Docker Hub 的密钥
name: 镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# main 上连推几次只构建最后一次；打标签的构建不取消
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 镜像名要小写；有 Docker Hub 的账号就多推一个
      - id: images
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/${OWNER,,}/mx-clarity"
            if [ "$HAS_DOCKERHUB" = true ]; then echo "${DOCKERHUB_USERNAME,,}/mx-clarity"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # latest 自己判断，不用 metadata-action 的 auto：预发布（标签里有 -）不打 latest。
      # 预发布本来就只打 {{version}}，不打 {{major}}.{{minor}}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # 只构建 linux/amd64：构建产物里的 sharp 二进制按构建机的架构装
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 正文由 scripts/release-notes.mjs 从 CHANGELOG.md 摘出，拉镜像的命令按实际推了的仓库写。
  # 标签里有 - 的是预发布；重跑时 Release 已经在了，只更新正文
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          images="ghcr.io/${OWNER,,}/mx-clarity"
          if [ "$HAS_DOCKERHUB" = true ]; then images="${DOCKERHUB_USERNAME,,}/mx-clarity $images"; fi
          RELEASE_IMAGES="$images" node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
